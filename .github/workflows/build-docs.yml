name: Build Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/results/**'
      - 'results/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.npmrc'
      - 'tsconfig.json'
      - '.github/workflows/build-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/results/**'
      - 'results/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.npmrc'
      - 'tsconfig.json'
      - '.github/workflows/build-docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm build:docs

name: Lighthouse Instrumentation Study

on:
  workflow_dispatch:
  push:
    branches: [codex/lighthouse-instrumentation-study]
    paths:
      - scripts/lighthouse-instrumentation-study.mjs
      - .github/workflows/lighthouse-instrumentation-study.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        framework:
          - app-astro
          - app-next-js
          - app-nuxt
          - app-react-router
          - app-solid-start
          - app-sveltekit
          - app-tanstack-start-react
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        working-directory: packages/${{ matrix.framework }}
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: packages/${{ matrix.framework }}
        run: pnpm build

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Measure server-rendered route
        run: >-
          node scripts/lighthouse-instrumentation-study.mjs
          --framework ${{ matrix.framework }}
          --scenario ssr
          --runs 5
          --output artifacts/lighthouse-study-${{ matrix.framework }}-ssr.json

      - name: Measure client-rendered route
        run: >-
          node scripts/lighthouse-instrumentation-study.mjs
          --framework ${{ matrix.framework }}
          --scenario csr
          --runs 5
          --output artifacts/lighthouse-study-${{ matrix.framework }}-csr.json

      - name: Upload raw samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-study-${{ matrix.framework }}
          path: artifacts/lighthouse-study-${{ matrix.framework }}-*.json
          retention-days: 7
          if-no-files-found: warn

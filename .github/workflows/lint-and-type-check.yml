name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-webui:
    name: WebUI native and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup WebUI Rust build
        uses: ./.github/actions/setup-webui

      - name: Install WebUI dependencies
        working-directory: packages/app-webui
        run: pnpm install --frozen-lockfile

      - name: Check WebUI
        working-directory: packages/app-webui
        run: |
          cargo fmt --check
          pnpm type-check
          pnpm test
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build WebUI
        working-directory: packages/app-webui
        run: pnpm build

      - name: Test WebUI browser routes
        working-directory: packages/app-webui
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm test:browser

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app and starter dependencies
        run: pnpm install:all:frozen

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint:all

  type-check:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app and starter dependencies
        run: pnpm install:all:frozen

      - name: Run type check
        run: pnpm type-check:all

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for docs component tests
        run: pnpm --filter @framework-performance/docs exec playwright install --with-deps --only-shell chromium

      - name: Run workspace tests
        run: pnpm -r test

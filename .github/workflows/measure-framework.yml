name: Measure Frameworks

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        default: ''
      measurements:
        description: 'JSON object mapping each measurement type to its frameworks'
        type: string
        required: true

permissions:
  contents: read

jobs:
  measure-install:
    if: toJson(fromJson(inputs.measurements)['install']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['install'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: install

  measure-build:
    if: toJson(fromJson(inputs.measurements)['build']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['build'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: build

  measure-dev-server:
    if: toJson(fromJson(inputs.measurements)['dev-server']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['dev-server'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: dev-server

  measure-ssr-request-throughput:
    if: toJson(fromJson(inputs.measurements)['ssr-request-throughput']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['ssr-request-throughput'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: ssr-request-throughput

  measure-ssr-load:
    if: toJson(fromJson(inputs.measurements)['ssr-load']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['ssr-load'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: ssr-load

  measure-ssr-router-link-load:
    if: toJson(fromJson(inputs.measurements)['ssr-router-link-load']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['ssr-router-link-load'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: ssr-router-link-load

  measure-dependencies:
    if: toJson(fromJson(inputs.measurements)['deps']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['deps'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: deps

  measure-client-side-rendered:
    if: toJson(fromJson(inputs.measurements)['client-side-rendered']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['client-side-rendered'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: client-side-rendered

  measure-server-side-rendered:
    if: toJson(fromJson(inputs.measurements)['server-side-rendered']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(inputs.measurements)['server-side-rendered'] }}
    uses: ./.github/workflows/measure-job.yml
    with:
      framework: ${{ matrix.framework }}
      source-sha: ${{ inputs.source-sha }}
      task: server-side-rendered

name: Measure Framework

on:
  workflow_call:
    inputs:
      standard:
        type: string
        required: true
      load:
        type: string
        required: true

permissions:
  contents: read

jobs:
  standard:
    if: inputs.standard != '[]'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: ${{ matrix.measurement.task == 'dev-server' && 30 || 360 }}
    env:
      RUNNER_LABEL: 'Depot depot-ubuntu-24.04 GitHub Actions runner (2 CPUs, 8 GB RAM, 100 GB disk, 2 GB disk accelerator)'
    strategy:
      fail-fast: false
      matrix:
        measurement: ${{ fromJson(inputs.standard) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run and validate measurement
        env:
          FRAMEWORK: ${{ matrix.measurement.framework }}
          TASK: ${{ matrix.measurement.task }}
        run: node packages/stats-generator/src/run-measurement.ts "$FRAMEWORK" "$TASK" "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.measurement.task }}-stats-${{ matrix.measurement.framework }}
          path: artifacts/${{ matrix.measurement.task }}-stats-${{ matrix.measurement.framework }}/
          retention-days: 1
          if-no-files-found: error

  load:
    if: inputs.load != '[]'
    runs-on: depot-ubuntu-24.04-16
    env:
      RUNNER_LABEL: 'Depot depot-ubuntu-24.04-16 GitHub Actions runner (16 CPUs, 64 GB RAM, 180 GB disk, 8 GB disk accelerator; server CPUs 0-11; Autocannon CPUs 12-15)'
    strategy:
      fail-fast: false
      matrix:
        measurement: ${{ fromJson(inputs.load) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run and validate isolated load measurement
        env:
          FRAMEWORK: ${{ matrix.measurement.framework }}
          TASK: ${{ matrix.measurement.task }}
        run: node packages/stats-generator/src/run-measurement.ts "$FRAMEWORK" "$TASK" "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.measurement.task }}-stats-${{ matrix.measurement.framework }}
          path: artifacts/${{ matrix.measurement.task }}-stats-${{ matrix.measurement.framework }}/
          retention-days: 1
          if-no-files-found: error

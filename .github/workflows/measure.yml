name: Measure
run-name: ${{ inputs.controller-run-id != '' && format('PR measurements {0}-{1}', inputs.controller-run-id, inputs.controller-run-attempt) || format('Measurements ({0})', github.event_name) }}

on:
  push:
    branches: [main]
  schedule:
    # Monday and Thursday at 04:00 UTC.
    - cron: '0 4 * * 1,4'
  workflow_dispatch:
    inputs:
      source-sha:
        description: 'Exact PR merge commit to measure; empty for a normal refresh'
        type: string
        default: ''
      base-sha:
        description: 'Base commit for the PR change selection'
        type: string
        default: ''
      pr-number:
        type: string
        default: ''
      controller-run-id:
        type: string
        default: ''
      controller-run-attempt:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: measure-${{ inputs.controller-run-id != '' && format('pr-{0}-{1}', inputs.controller-run-id, inputs.controller-run-attempt) || 'results' }}
  cancel-in-progress: ${{ inputs.controller-run-id != '' }}

jobs:
  select:
    runs-on: depot-ubuntu-24.04
    outputs:
      measurements: ${{ steps.select.outputs.measurements }}
      has-changes: ${{ steps.select.outputs.has-changes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: ${{ inputs.source-sha == '' && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: select
        env:
          MEASUREMENT_BASE_SHA: ${{ inputs.base-sha }}
          MEASUREMENT_HEAD_SHA: ${{ inputs.source-sha }}
        run: node packages/stats-generator/src/measurement-ci.ts select

  measure:
    needs: select
    if: needs.select.outputs.has-changes == 'true'
    uses: ./.github/workflows/measure-framework.yml
    with:
      measurements: ${{ needs.select.outputs.measurements }}
      source-sha: ${{ inputs.source-sha }}

  assemble:
    name: Validate results
    needs: [select, measure]
    if: always() && needs.select.outputs.has-changes == 'true' && needs.measure.result == 'success'
    runs-on: depot-ubuntu-24.04
    env:
      RUNNER_LABEL: 'Depot depot-ubuntu-24.04 GitHub Actions runner (2 CPUs, 8 GB RAM, 100 GB disk, 2 GB disk accelerator)'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: ${{ inputs.source-sha == '' && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Assemble and validate temporary results
        run: node packages/stats-generator/src/measurement-ci.ts assemble artifacts artifacts/results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measured-results
          path: artifacts/results/
          retention-days: 7
          if-no-files-found: error

  results-pr:
    name: Save results
    needs: [select, assemble]
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && inputs.source-sha == '' &&
      inputs.pr-number == '' && inputs.controller-run-id == '' &&
      needs.select.outputs.has-changes == 'true' && needs.assemble.result == 'success'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: measured-results
          path: artifacts/results
      - name: Preserve pending results PR updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --head automated-stats-update --state open --json number --jq 'length')
          if [[ "$OPEN_PRS" != "0" ]]; then
            git fetch origin automated-stats-update
            git diff --binary HEAD...FETCH_HEAD -- results/ > "$RUNNER_TEMP/pending-results.patch"
            if [[ -s "$RUNNER_TEMP/pending-results.patch" ]]; then
              git apply --3way "$RUNNER_TEMP/pending-results.patch"
            fi
          fi
      - name: Update canonical results
        run: node packages/stats-generator/src/measurement-ci.ts promote artifacts/results
      - run: pnpm exec prettier --write results/
      - name: Create or update results pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -z $(git status --short -- results/) ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git checkout -B automated-stats-update
          git add results/
          git commit -m "Update framework measurements"
          git push --force-with-lease origin automated-stats-update
          if ! gh pr list --head automated-stats-update --state open | grep -q .; then
            gh pr create --title "Update framework measurements" \
              --body "Automated framework measurements with validated current results and version history under results/." \
              --base main --head automated-stats-update
          else
            echo "PR already exists, updated with new commits"
          fi

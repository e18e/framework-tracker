name: Validate Framework Stats
on:
  workflow_call: {}
jobs:
  setup:
    runs-on: depot-ubuntu-24.04
    outputs:
      install-matrix: ${{ steps.set-matrix.outputs.install }}
      build-matrix: ${{ steps.set-matrix.outputs.build }}
      dev-server-matrix: ${{ steps.set-matrix.outputs.dev-server }}
      ssr-request-throughput-matrix: ${{ steps.set-matrix.outputs.ssr-request-throughput }}
      ssr-load-matrix: ${{ steps.set-matrix.outputs.ssr-load }}
      ssr-router-link-load-matrix: ${{ steps.set-matrix.outputs.ssr-router-link-load }}
      deps-matrix: ${{ steps.set-matrix.outputs.deps }}
      client-side-rendered-matrix: ${{ steps.set-matrix.outputs.client-side-rendered }}
      server-side-rendered-matrix: ${{ steps.set-matrix.outputs.server-side-rendered }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set matrices from frameworks.json
        id: set-matrix
        run: |
          FRAMEWORKS=$(cat .github/frameworks.json)
          echo "install=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.starter) | select(.starter.measurements | map(.type) | contains(["install"])) | {name, displayName, package: .starter.package, buildScript: .starter.buildScript, buildOutputDir: .starter.buildOutputDir, measurements: .starter.measurements}]')" >> $GITHUB_OUTPUT
          echo "build=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.starter) | select(.starter.measurements | map(.type) | contains(["build"])) | {name, displayName, package: .starter.package, buildScript: .starter.buildScript, buildOutputDir: .starter.buildOutputDir, measurements: .starter.measurements}]')" >> $GITHUB_OUTPUT
          echo "dev-server=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.starter) | select(.starter.measurements | map(.type) | contains(["devServer"])) | {name, displayName, package: .starter.package, devServerPort: .starter.devServerPort, measurements: .starter.measurements}]')" >> $GITHUB_OUTPUT
          echo "ssr-request-throughput=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.app) | select(.app.measurements | map(.type) | contains(["ssrRequestThroughput"])) | {name, displayName, package: .app.package, buildScript: .app.buildScript, buildOutputDir: .app.buildOutputDir, measurements: .app.measurements}]')" >> $GITHUB_OUTPUT
          echo "ssr-load=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.app) | select(.app.measurements | map(.type) | contains(["ssrLoad"])) | {name, displayName, package: .app.package, buildScript: .app.buildScript, buildOutputDir: .app.buildOutputDir, measurements: .app.measurements}]')" >> $GITHUB_OUTPUT
          echo "ssr-router-link-load=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.app) | select(.app.measurements | map(.type) | contains(["ssrRouterLinkLoad"])) | {name, displayName, package: .app.package, buildScript: .app.buildScript, buildOutputDir: .app.buildOutputDir, measurements: .app.measurements}]')" >> $GITHUB_OUTPUT
          echo "deps=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.starter) | select(.starter.measurements | map(.type) | contains(["dependencies"])) | {name, displayName, package: .starter.package}]')" >> $GITHUB_OUTPUT
          echo "client-side-rendered=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.app) | select(.app.measurements | map(.type) | contains(["clientSideRendered"])) | {name, displayName, package: .app.package, buildScript: .app.buildScript, buildOutputDir: .app.buildOutputDir, measurements: .app.measurements}]')" >> $GITHUB_OUTPUT
          echo "server-side-rendered=$(echo "$FRAMEWORKS" | jq -c '[.[] | select(.app) | select(.app.measurements | map(.type) | contains(["serverSideRendered"])) | {name, displayName, package: .app.package, buildScript: .app.buildScript, buildOutputDir: .app.buildOutputDir, measurements: .app.measurements}]')" >> $GITHUB_OUTPUT
  validate-manifests:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install stats-generator dependencies
        run: pnpm install --frozen-lockfile --filter @framework-tracker/stats-generator
      - name: Validate first-party dependency manifests
        run: pnpm --filter @framework-tracker/stats-generator validate:first-party-dependencies
  measure-install:
    if: needs.setup.outputs.install-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.install-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install stats-generator dependencies
        run: pnpm install --frozen-lockfile --filter @framework-tracker/stats-generator
      - name: Run install benchmark
        run: |
          pnpm --filter @framework-tracker/stats-generator run:install ${{ matrix.framework.package }} 1
      - name: Validate install output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} install
    needs: setup
  measure-build:
    if: needs.setup.outputs.build-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.build-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build benchmark
        run: |
          pnpm --filter @framework-tracker/stats-generator run:build ${{ matrix.framework.package }} 1
      - name: Scan build output for vendored core-js
        run: pnpm --filter @framework-tracker/stats-generator run:corejs ${{ matrix.framework.package }}
      - name: Scan build output for browser baseline requirements
        if: contains(toJson(matrix.framework.measurements), 'browserBaseline')
        run: pnpm --filter @framework-tracker/stats-generator run:browser-baseline ${{ matrix.framework.package }}
      - name: Validate build output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} build
      - name: Validate browserBaseline output
        if: contains(toJson(matrix.framework.measurements), 'browserBaseline')
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} browserBaseline
    needs: setup
  measure-dev-server:
    if: needs.setup.outputs.dev-server-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.dev-server-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run dev server benchmark
        run: |
          pnpm --filter @framework-tracker/stats-generator run:dev-server ${{ matrix.framework.package }} 1
      - name: Validate devServer output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} devServer
    needs: setup
  measure-ssr-request-throughput:
    if: needs.setup.outputs.ssr-request-throughput-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.ssr-request-throughput-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build
      - name: Run SSR request throughput benchmark
        run: pnpm --filter @framework-tracker/stats-generator run:ssr-request-throughput ${{ matrix.framework.package }}
      - name: Validate ssrRequestThroughput output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} ssrRequestThroughput
    needs: setup
  measure-dependencies:
    if: needs.setup.outputs.deps-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.deps-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install stats-generator dependencies
        run: pnpm install --frozen-lockfile --filter @framework-tracker/stats-generator
      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile
      - name: Run e18e analysis
        working-directory: ./packages/${{ matrix.framework.package }}
        run: npx @e18e/cli@0.5.0 analyze --json > e18e-stats.json || true
      - name: Collect framework dependency stats
        env:
          STARTER_PACKAGE: ${{ matrix.framework.package }}
        run: node packages/stats-generator/src/run-framework-dependency-scan.ts "$STARTER_PACKAGE"
      - name: Collect first-party dependency stats
        env:
          STARTER_PACKAGE: ${{ matrix.framework.package }}
        run: node packages/stats-generator/src/run-first-party-dependency-scan.ts "$STARTER_PACKAGE"
      - name: Scan installed dependencies for Node engine constraints
        run: pnpm --filter @framework-tracker/stats-generator run:node-engines ${{ matrix.framework.package }}
      - name: Validate nodeEngines output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} nodeEngines
    needs: setup
  measure-ssr-load:
    if: needs.setup.outputs.ssr-load-matrix != '[]'
    runs-on: depot-ubuntu-24.04-16
    env:
      RUNNER_LABEL: Depot depot-ubuntu-24.04-16 GitHub Actions runner (16 CPUs, 64 GB RAM, 180 GB disk, 8 GB disk accelerator; server CPUs 0-11; Autocannon CPUs 12-15)
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.ssr-load-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build
      - name: Run SSR load benchmark
        run: pnpm --filter @framework-tracker/stats-generator run:ssr-load:containerized ${{ matrix.framework.package }}
      - name: Validate ssrLoad output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} ssrLoad
    needs: setup
  measure-ssr-router-link-load:
    if: needs.setup.outputs.ssr-router-link-load-matrix != '[]'
    runs-on: depot-ubuntu-24.04-16
    env:
      RUNNER_LABEL: Depot depot-ubuntu-24.04-16 GitHub Actions runner (16 CPUs, 64 GB RAM, 180 GB disk, 8 GB disk accelerator; server CPUs 0-11; Autocannon CPUs 12-15)
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.ssr-router-link-load-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build
      - name: Run SSR router link load benchmark
        run: pnpm --filter @framework-tracker/stats-generator run:ssr-router-link-load:containerized ${{ matrix.framework.package }}
      - name: Validate ssrRouterLinkLoad output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} ssrRouterLinkLoad
    needs: setup
  measure-client-side-rendered:
    if: needs.setup.outputs.client-side-rendered-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.client-side-rendered-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Run client-side rendered benchmark
        run: pnpm --filter @framework-tracker/stats-generator run:client-side-rendered ${{ matrix.framework.package }} 1
      - name: Validate clientSideRendered output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} clientSideRendered
    needs: setup
  measure-server-side-rendered:
    if: needs.setup.outputs.server-side-rendered-matrix != '[]'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.server-side-rendered-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Remove previous measurement outputs
        env:
          PACKAGE: ${{ matrix.framework.package }}
        run: rm -f "packages/$PACKAGE/ci-stats.json" "packages/$PACKAGE/install-stats.json" "packages/$PACKAGE/build-stats.json" "packages/$PACKAGE/dev-server-stats.json" "packages/$PACKAGE/browser-baseline-stats.json" "packages/$PACKAGE/node-engines-stats.json"
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install package dependencies
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm install --frozen-lockfile
      - name: Build app
        working-directory: ./packages/${{ matrix.framework.package }}
        run: pnpm build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Run server-side rendered benchmark
        run: pnpm --filter @framework-tracker/stats-generator run:server-side-rendered ${{ matrix.framework.package }} 1
      - name: Validate serverSideRendered output
        run: pnpm --filter @framework-tracker/stats-generator validate ${{ matrix.framework.package }} serverSideRendered
    needs: setup
  validate:
    if: always()
    needs:
      - setup
      - validate-manifests
      - measure-install
      - measure-build
      - measure-dev-server
      - measure-ssr-request-throughput
      - measure-dependencies
      - measure-ssr-load
      - measure-ssr-router-link-load
      - measure-client-side-rendered
      - measure-server-side-rendered
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Check all validations passed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success" || .result == "skipped") and .setup.result == "success" and .["validate-manifests"].result == "success"'

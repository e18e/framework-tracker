packages:
  - 'packages/results'
  - 'packages/docs'
  - 'packages/stats-generator'
  - 'packages/cwv-stats'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - baseline-detector@0.4.1

# Keep shared schemas and Astro on the same Zod 4 implementation.
overrides:
  'zod@>=4': 4.6.7

catalog:
  zod: 4.6.7
